<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Balkonkraftwerk Rechner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>☀️ Was bringt das kleine Kraftwerk?</h1>

        <p>Leistung (Watt):</p>
        <input type="number" id="power" placeholder="z.B. 800">
        <p>Wirkungsgrad (%):</p>
        <input type="number" id="eff" placeholder="z.B. 80">
        <p>Breitengrad:</p>
        <input type="number" id="lat" placeholder="z.B. 49.35" step="0.01">
        <p>Längengrad:</p>
        <input type="number" id="lon" placeholder="z.B. 8.14" step="0.01">
        <button id="calculateButton">Berechnen</button>
        <div id="result"></div>
        <canvas id="chart" width="360" height="220"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
